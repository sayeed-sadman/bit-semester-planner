# H2 File-based Database (data persists between restarts)
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/bitsemesterplanner
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console (for development/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable open-in-view warning
spring.jpa.open-in-view=false

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson — serialize LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Zurich

# Server port
server.port=8080

# Anthropic API
anthropic.api.key=${ANTHROPIC_API_KEY:NOT_SET}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
